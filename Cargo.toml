[package]
name = "sepia-octopus-receive"
version = "0.1.0"
edition = "2021"

[dependencies]
sepia-plugin-sdk = { git = "https://github.com/lingyuins/Sepia", rev = "e912ca66f022978c1fecf3fac721bb291efc7a0b" }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
